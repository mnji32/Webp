<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>마우스 클릭 연습</title>
    <style>
        table {
            border: 1px solid blue;
            border-collapse: collapse;
        }

        td {
            border: 1px solid blue;
            width: 50px;
            height: 50px;
            padding: 0px;
        }

        img {
            width: 50px;
            height: 50px;
            display: block;
        }
    </style>
    <script>
        let select = 0;
        let img = new Image();
        img.src = "donkey.jpg";

        function set() {
            let table = document.getElementById("table1");
            for (let i = 0; i < 10; i++) {
                let row = document.createElement("tr");
                for (let j = 0; j < 10; j++) {
                    let col = document.createElement("td");
                    col.innerHTML = "<img src='' style='visibility:hidden'>";
                    row.appendChild(col);
                }
                table.appendChild(row);
            }
            for (let i = 0; i < 100; i++) {
                document.images[i].onclick = moveImage;
            }
            moveImage();
        }

        function moveImage() {
            document.images[select].style.visibility = "hidden";
            document.images[select].src = "";

            select = Math.floor(Math.random() * 100);

            document.images[select].src = img.src;
            document.images[select].style.visibility = "visible";
        }
    </script>
</head>

<body onload="set()">
    <h3>마우스 클릭 연습</h3>
    <hr>
    <table id="table1"></table>
</body>

</html>
