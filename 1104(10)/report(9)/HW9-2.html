<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>라디오 버튼과 이미지 출력</title>
    <script>
        function drawImage() {
            let fruit = document.getElementsByName("fruit");
            let img = document.getElementById("image");
            for (let i = 0; i < fruit.length; i++) {
                if (fruit[i].checked == true) {
                    img.src = fruit[i].value;
                }
            }
        }
    </script>
</head>

<body>
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>
    <form>
        <input type="radio" name="fruit" value="banana.jpg" onchange="drawImage()">바나나
        <input type="radio" name="fruit" value="mango.jpg" onchange="drawImage()">망고
        <input type="radio" name="fruit" value="apple.jpg" onchange="drawImage()" checked>사과
        <br>
        <img id="image" src="apple.jpg" width="200" height="200">
    </form>
</body>

</html>
