<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>animation</title>
    <style>
        img {
            animation-name: rotation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }

        @keyframes rotation {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h3>어지러워요</h3>
    <hr>
    <img src="spongebob.jpg">
</body>

</html>
