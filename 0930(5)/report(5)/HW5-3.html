<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>오디오 재생 리스트</title>
    <style>
        table {
            margin-top: 20px;
        }

        td.number {
            border: 1px solid yellowgreen;
        }

        td.song {
            border-bottom: 1px solid black;
        }

        button:hover {
            color: magenta;
        }
    </style>
</head>

<body>
    <h3>오디오 재생 리스트</h3>
    <hr>
    <table>
        <tr>
            <td class="number">1</td>
            <td class="song">애국가</td>
            <td><button type="button">재생</button></td>
            <td><button type="button">중지</button></td>
        </tr>
        <tr>
            <td class="number">2</td>
            <td class="song">Moon Glow</td>
            <td><button type="button">재생</button></td>
            <td><button type="button">중지</button></td>
        </tr>
        <tr>
            <td class="number">3</td>
            <td class="song">Embraceable You</td>
            <td><button type="button">재생</button></td>
            <td><button type="button">중지</button></td>
        </tr>
    </table>
</body>

</html>
