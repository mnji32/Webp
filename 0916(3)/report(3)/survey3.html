<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 관한 설문</title>
</head>

<body>
    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
    </header>
    <section>
        <article>
            학년
            <label><input type="radio" name="학년" value="1">1학년</label>
            <label><input type="radio" name="학년" value="2">2학년</label>
            <label><input type="radio" name="학년" value="3">3학년</label>
            <label><input type="radio" name="학년" value="4">4학년</label>
        </article>
        <br>

        <article>
            성별
            <label><input type="radio" name="성별" value="man">남</label>
            <label><input type="radio" name="성별" value="woman">여</label>
        </article>
        <br>

        <article>
            관심분야
            <select name="관심분야">
                <option value="mobile">모바일 소프트웨어</option>
                <option value="web">웹 소프트웨어</option>
                <option value="game">게임 소프트웨어</option>
                <option value="ai">AI/머신러닝 소프트웨어</option>
            </select>
        </article>
        <br>

        <article>
            진로
            <label><input type="checkbox" name="진로" value="develop">개발</label>
            <label><input type="checkbox" name="진로" value="planning">기획</label>
            <label><input type="checkbox" name="진로" value="sales">영업</label>
            <label><input type="checkbox" name="진로" value="startup">창업</label>
        </article>
        <br>

        <article>
            남기고 싶은 말
            <br>
            <textarea cols="50" rows="10" placeholder="글을 남겨주세요"></textarea>
        </article>
    </section>

    <footer>
        <p>Copyright 2022 by Kitae</p>
    </footer>
</body>

</html>
