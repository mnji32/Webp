<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f1ec;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: #333;
      }
      .card {
        width: 100%;
        max-width: 420px;
        margin: 16px;
        padding: 28px 24px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 20px;
        font-size: 20px;
        text-align: center;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: bold;
        font-size: 14px;
      }
      .required { color: #e05a47; }
      input, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
      }
      textarea { resize: vertical; min-height: 90px; }
      input:focus, textarea:focus { outline: none; border-color: #e0893a; }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #e0893a;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled { background: #bbb; cursor: default; }
      .error { margin-top: 12px; color: #e05a47; font-size: 14px; text-align: center; }
      .done {
        display: none;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>26년 11월 25일 저녁 신청 받기</h1>

      <form id="applyForm">
        <label for="name">이름 <span class="required">*</span></label>
        <input id="name" name="name" type="text" maxlength="30" required>

        <label for="food">음식 <span class="required">*</span></label>
        <input id="food" name="food" type="text" maxlength="50" required>

        <label for="message">하고 싶은 말</label>
        <textarea id="message" name="message" maxlength="500"></textarea>

        <button id="submitBtn" type="submit">확인</button>
        <div id="error" class="error"></div>
      </form>

      <div id="done" class="done">답장 감사합니다.</div>
    </div>

    <script>
      const form = document.getElementById('applyForm');
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('error');
      const doneBox = document.getElementById('done');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.textContent = '';

        const data = {
          name: form.name.value.trim(),
          food: form.food.value.trim(),
          message: form.message.value.trim()
        };

        if (!data.name || !data.food) {
          errorBox.textContent = '이름과 음식은 꼭 입력해 주세요.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '저장 중...';

        google.script.run
          .withSuccessHandler(function (msg) {
            // 폼을 숨기고 완료 메시지만 보여주며 종료
            form.style.display = 'none';
            doneBox.textContent = msg || '답장 감사합니다.';
            doneBox.style.display = 'block';
          })
          .withFailureHandler(function (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = '확인';
            errorBox.textContent = '저장 중 오류가 발생했어요: ' + err.message;
          })
          .submitForm(data);
      });
    </script>
  </body>
</html>
