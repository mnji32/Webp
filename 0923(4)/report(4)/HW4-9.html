<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>text-shadow와 box-shadow</title>
    <style>
        h2 {
            color: yellow;
            text-align: center;
            text-shadow: 3px 3px 2px blue;
        }
        img:hover {
            box-shadow: 0px 0px 7px blue;
        }
    </style>
</head>

<body>
    <h2>Most Visited Pages</h2>
    <hr>
    <table>
        <tr>
            <td><a href="http://www.naver.com">
                    <img src="naver.jpg" width="200" height="150">
                </a></td>
            <td><a href="http://www.chosun.com">
                    <img src="chosun.jpg" width="200" height="150">
                </a></td>
            <td><a href="http://www.amazon.com">
                    <img src="amazon.jpg" width="200" height="150">
                </a>
            </td>
        </tr>
    </table>
</body>

</html>
