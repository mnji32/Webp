<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>:hover 활용</title>
    <style>
        div.card {
            background-image: url("back.png");
            background-size: cover;
            width: 150px;
            height: 200px;
        }

        div.card:hover {
            background-image: url("spade7.png");
        }
    </style>
</head>

<body>
    <h3>:hover 활용</h3>
    <hr>
    <table>
        <tr>
            <td>
                <p>마우스를 올리면 카드의 앞면이 보인다.</p>
            <td>
                <div class="card"></div>
            </td>
        </tr>
</body>

</html>
