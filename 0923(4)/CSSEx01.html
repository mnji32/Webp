<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>간단한 CSS 예제</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f2f2f2;
			text-align: center;
		}

		h1 {
			color: #3366cc;
		}

		p {
			color: #555;
			font-size: 18px;
		}

		button {
			padding: 10px 20px;
			color: white;
			background-color: #3366cc;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}

		button:hover {
			background-color: #224499;
		}
	</style>
</head>
<body>
	<h1 class "button">CSS 예제</h1>
	<p id="abc">CSS로 글자와 버튼의 스타일을 꾸며 보세요.</p>
	<button>클릭</button>
</body>
</html>
