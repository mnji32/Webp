<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HTML5</title>
    <script>
        function load() {
            let win = window.open("", "_blank", "left=500, top=400, width=200,height=80");
            win.document.write("접속 감사합니다!");
            win.document.close();
        }
    </script>
</head>

<body onload="load()">
    <h3>HTML5</h3>
    <hr>
    <p>
        HTML5를 학습하는 사이트입니다.
        여기서 HTML5, CSS3, 자바스크립트를
        배울 수 있습니다.</p>
</body>

</html>
