<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>갬블링 게임</title>
    <style>
        #game {
            display: inline-block;
            border: 1px solid purple;
            background-color: blanchedalmond;
        }

        #game span {
            display: inline-block;
            width: 55px;
            color: navy;
            font: italic 50px consolas;
            text-align: center;
        }

        #result {
            color: violet;
            font: italic 17px consolas;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h3>갬블링 게임</h3>
    <p>각 숫자를 클릭하면 0에서 2사이의 난수로 바뀝니다. 모두 같은 수가 나오면 승리합니다.</p>
    <hr>
    <div id="game">
        <span class="number" onclick="change(this)">0</span>
        <span class="number" onclick="change(this)">0</span>
        <span class="number" onclick="change(this)">0</span>
    </div>
    <div id="result" onclick="again()"></div>

    <script>
        let count = 0;
        function change(obj) {
            if (count == 3) {
                return;
            }

            obj.innerHTML = Math.floor(Math.random() * 3);
            count++;

            if (count == 3) {
                let n = document.getElementsByClassName("number");
                let win = (n[0].innerHTML == n[1].innerHTML && n[1].innerHTML == n[2].innerHTML);
                document.getElementById("result").innerHTML = (win ? "Success" : "fail") + "(click here to do again)";
            }
        }

        function again() {
            let n = document.getElementsByClassName("number");
            n[0].innerHTML = "0";
            n[1].innerHTML = "0";
            n[2].innerHTML = "0";
            document.getElementById("result").innerHTML = "";
            count = 0;
        }
    </script>
</body>

</html>
