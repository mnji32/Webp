<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>z-index 스타일 프로퍼티</title>
    <style>
        div {
            position: absolute;
        }

        img {
            position: absolute;
        }
    </style>
</head>

<body>
    <h3>z-index 스타일 프로퍼티</h3>
    <hr>
    <div>
        <img src="spade-A.png" width="100" height="140" alt="스페이드A">
        <img src="spade-2.png" width="100" height="140" alt="스페이드2">
        <img src="spade-3.jpg" width="100" height="140" alt="스페이드3">
        <img src="spade-7.png" width="100" height="140" alt="스페이드7">
    </div>

    <script>
        let imgTags = document.getElementsByTagName("img");
        let minZ = 0;

        for (let i = 0; i < imgTags.length; i++) {
            imgTags[i].style.left = "10px";
            imgTags[i].style.top = "10px";
            imgTags[i].onclick = function () {
                this.style.zIndex = --minZ;
            };
        }
    </script>
</body>

</html>
