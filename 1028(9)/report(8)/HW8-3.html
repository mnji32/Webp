<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>visibility 프로퍼티</title>
    <style>
        span {
            color: blue;
        }
    </style>
    <script>
        function show() {
            let spanTags = document.getElementsByTagName("span");
            for (let i = 0; i < spanTags.length; i++) {
                if (spanTags[i].style.visibility == "visible") {
                    spanTags[i].style.visibility = "hidden";
                }
                else {
                    spanTags[i].style.visibility = "visible";
                }
            }
        }
    </script>
</head>

<body>
    <h3>다음 빈 곳에 숨은 단어?
        <button onclick="show()">show/hide</button>
    </h3>
    <hr>
    <ul>
        <li>I (<span style="visibility:hidden">love</span>) you.
        <li>CSS is Cascading (<span style="visibility:hidden">Style</span>) Sheet.
        <li>응답하라 (<span style="visibility:hidden">1988</span>).
    </ul>
</body>

</html>
