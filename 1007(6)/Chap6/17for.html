<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>for 문</title>
</head>

<body>
    <h3>for 문으로 10px~35px 크기 출력</h3>
    <hr>
    <script>
        for (let size = 10; size <= 35; size += 5) {
            document.write("<span ");
            document.write("style='font-size:" + size + "px'>");
            document.write(size + "px");
            document.write("</span>");
        }
    </script>
</body>

</html>

<!-- for문을 이용하여 10px ~ 35px까지 텍스트 출력 -->
