<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>document.write()</title>
</head>

<body>
    <script>
        let x = 5;
        for (let i = 1; i <= x; i++) {
            for (let j = 1; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>")
        }
    </script>
</body>

</html>
