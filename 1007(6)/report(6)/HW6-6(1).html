<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>1</title>
</head>

<body>
    <script>
        function big(x, y) {
            if (parseInt(x) > parseInt(y)) { return x; }
            else { return y; }
        }
    </script>
    
    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>

</html>
